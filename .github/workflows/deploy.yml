# Build and deploy the site to Cloudflare Pages.
#
# THIS WORKFLOW IS THE SOLE OWNER of generation, building and publishing for the
# opencharly.ai site. The site is STANDALONE: it pins the charly repository by CI-time
# commit (no committed submodule — the charly submodule leaked the whole charly repo into
# consumer fetch trees and was removed), and this workflow
#
#   1. clones the pinned charly (recursive, with its box/* submodules) into /tmp/charly
#      at CI time and checks out the recorded source commit, plus the pinned
#      marketplace submodule (the corpus the skill pages project from),
#   2. builds the standalone plugin-docs CLI binary at the pinned plugin tag (generation
#      reads the pinned charly SOURCE TREE, so that checkout never has to compile),
#   3. regenerates the generated half of the content tree with that plugin-docs CLI
#      (`plugin-docs-bin generate` — the same engine the `charly docs generate` word
#      dispatches to),
#   4. FAILS if the committed content does not match what the pinned charly generates
#      (the drift gate: regeneration on a clean tree is a no-op, so any diff means a
#      docs PR must bump the charly CI-time commit and carry the regenerated pages),
#   5. REPORTS whether the pinned marketplace corpus is behind the corpus's merged
#      main — reported, never failed: a corpus that is behind is an advance
#      available now, and the remedy is a regeneration PR that bumps the pin, not a
#      gate (the drift gate above cannot see a stale corpus, because the PINNED
#      corpus regenerates its own old pages perfectly),
#   6. builds the Astro site and deploys to Cloudflare Pages.
#
# WHY A WORKFLOW RATHER THAN CLOUDFLARE'S GIT INTEGRATION: connecting a Cloudflare Pages project
# to a GitHub org requires an OAuth handshake that Cloudflare must initiate — there is no API for
# it (POST .../pages/connections is 405, GET-only), just as GitHub exposes no API to create an App
# installation. Both are third-party access grants that require a human at a consent screen. This
# workflow reaches the same end state — production deploys on main, preview deploys on PRs —
# using only an API token, which IS automatable.
#
# The trade-off is explicit: the Cloudflare token lives in this repo's Actions secrets. It is
# scoped to Cloudflare Pages edit plus DNS edit on the opencharly.ai zone, and nothing else.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never let two deploys of the same ref race; the later one wins.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Only what the job uses. wrangler-action is given no gitHubToken, so it creates no GitHub
# Deployment and posts no PR comment — granting deployments/pull-requests write would be
# unused privilege.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # This job's TOTAL deadline. It is a backstop, not the discriminating
    # bound: the step bounds below are what say WHICH step died, and this
    # only fires when the whole job is stuck. Sized from the measured runs:
    # the 56 successful runs of the FIXED window 2026-09-22..2026-10-24
    # (median 10.6 min), whose longest — 15.15 min, on 2026-09-22 — is also
    # the longest this job has ever run in the retained history (583
    # successful runs, back to 2026-08-03). 60 min is 4.0x that maximum,
    # and it stays UNDER the org validator's own 70-minute head-settle
    # bound, so a stall in this workflow closes with a named failure — and
    # closes BEFORE the validator's own wait gives up, which is the
    # deadlock half of opencharly/docs#162.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        timeout-minutes: 10
        with:
          # The pinned marketplace is the corpus the recipe pages project from —
          # fetched via the submodule below. charly is NOT a submodule anymore
          # (it leaked the whole charly repo into consumer fetch trees): the
          # generator's source tree is cloned recursively at CI time (next step).
          #
          # `fetch-depth` is left at its default (1), so the corpus submodule is
          # a DEPTH-1 clone: actions/checkout runs `git submodule update --init
          # --force --depth=<fetch-depth>` (actions/checkout@v7,
          # `src/git-command-manager.ts`, `submoduleUpdate`). The corpus-currency
          # report below therefore deepens the corpus's history before it judges
          # ancestry — a depth-1 history cannot answer that question.
          submodules: recursive

      # EVERY step in this workflow carries a deadline, and this is the control
      # that keeps it that way. A step with no `timeout-minutes` has no bound:
      # if the command it runs hangs — a clone that never finishes, a generator
      # waiting on a lock — the step runs until the runner's own six-hour limit
      # and the job never reports WHICH step died. This repo's workflow had no
      # bound on any of its steps (opencharly/docs#162), so the rule is
      # enforced here, on the workflows this repo OWNS.
      #
      # The check runs FIRST, before the expensive steps: a workflow that has
      # lost a deadline is a defect in the workflow, and finding it before the
      # regeneration says so.
      #
      # It reports, and does not assert, the one workflow file this repo does
      # not own: `.github/workflows/tag-on-merge.yml` is a distributed copy of
      # opencharly/.github's canonical template, and a deadline added to the
      # copy here would be erased by the org's own reconcile pass — the
      # deadline belongs to the template (opencharly/.github#256).
      - name: Check that every workflow step carries a deadline
        run: python3 .github/scripts/check_step_timeouts.py
        timeout-minutes: 5

      # A check that cannot fail is not a check. The self-test proves the
      # checker rejects an unbounded step — and, the case a grep falls into,
      # that a `timeout-minutes:` written inside a `run:` block is TEXT to the
      # shell and does NOT satisfy the rule.
      - name: Prove the step-deadline checker rejects an unbounded step
        run: python3 .github/scripts/check_step_timeouts.py --self-test
        timeout-minutes: 5

      # And a self-test that cannot fail is not a self-test. Each mechanism of
      # the checker is removed, one at a time, and the self-test must turn RED
      # on the fixture that covers it: a mutation that still passes is a
      # mechanism the coverage does not reach.
      - name: Prove the step-deadline self-test can fail (mutation harness)
        run: python3 .github/scripts/test_check_step_timeouts.py
        timeout-minutes: 5

      - name: Test the corpus-currency report
        timeout-minutes: 5
        run: bash .github/docs-corpus/test_check_corpus_currency.sh

      - name: Report the corpus pin's currency
        timeout-minutes: 10
        # The corpus pin is advanced by a MANUAL act after the corpus lands, so the
        # site trails the corpus by however long nobody ran the regeneration — and
        # the drift gate further down CANNOT see it: the PINNED corpus generates its
        # own (old) pages perfectly, so a stale corpus is invisible to it.
        #
        # This step asks the second question the workflow can answer from what it
        # already has: is the pinned corpus behind the corpus's merged main? The
        # answer is REPORTED, never failed — a corpus that is behind is an advance
        # available NOW, the same shape the pin contract calls `behind`: a
        # reportable state, not a broken edge. A workflow that FAILED on it would be
        # red on every push until somebody ran the regeneration PR, and the remedy is
        # that PR, not a gate.
        #
        # The report names the PIN CONTRACT's states (`cur`, `behind`,
        # `not-on-the-served-line`) plus two it refuses to guess (`undecidable`,
        # `unreadable`), and it judges only from a history that can answer: the
        # corpus checkout here is a depth-1 clone (the checkout step above), so the
        # report deepens it first and says `undecidable` when it cannot. A report
        # that stated a state it could not establish would be worse than no report.
        run: |
          set -o pipefail
          bash .github/docs-corpus/check_corpus_currency.sh . | tee /tmp/corpus-currency.txt
          {
            echo "### corpus pin"
            echo ""
            cat /tmp/corpus-currency.txt
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Fetch the pinned charly source (CI-time temp checkout, recursive for box/*)
        timeout-minutes: 15
        run: |
          # Clone WITHOUT --recursive, then checkout the pinned commit, THEN init the box/*
          # submodules: --recursive at clone time pulls each box at its default-branch HEAD,
          # but the committed docs content was generated against the box commits the pinned
          # charly checkout records — checkout-then-init pins them exactly.
          git clone https://github.com/opencharly/charly.git /tmp/charly && git -C /tmp/charly checkout bafd8dbc3110904872831998fb4caa701cc2990c && git -C /tmp/charly submodule update --init --recursive
          # The four root narratives (SOUL.md/VISION.md/GRIEVANCES.md/LIBERATION.md) moved
          # from the charly root to the UMBRELLA root (opencharly/opencharly#357); the
          # generator reads them from the umbrella checkout passed as --narrative below.
          # No submodule init — only the root files are read.
          git clone https://github.com/opencharly/opencharly.git /tmp/umbrella && git -C /tmp/umbrella checkout e631aacf32df4e26a66f2cb6a75fc9e85e212399

      - uses: actions/setup-node@v7
        timeout-minutes: 10
        with:
          node-version-file: .node-version
          cache: npm

      # setup-go hashes only files inside GITHUB_WORKSPACE. Keep the module it
      # actually compiles here, rather than keying its cache on /tmp/charly.
      - name: Fetch the pinned docs generator
        timeout-minutes: 10
        run: git clone --depth 1 --branch v2026.289.0814 https://github.com/opencharly/plugin-docs.git .docs-generator

      - uses: actions/setup-go@v7
        timeout-minutes: 10
        with:
          go-version-file: .docs-generator/candy/plugin-docs/go.mod
          cache-dependency-path: .docs-generator/candy/plugin-docs/go.sum

      - name: Build the standalone plugin-docs CLI binary
        timeout-minutes: 15
        working-directory: .docs-generator/candy/plugin-docs
        run: go build -o /tmp/plugin-docs-bin ./cmd/serve

      - name: Test the generated-content drift gate
        timeout-minutes: 10
        run: python3 .github/docs-corpus/test_check_drift.py

      - name: Write the corpus wiring candy from the pins file
        timeout-minutes: 5
        run: |
          mkdir -p /tmp/charly/candy/docs-corpus
          cp .github/docs-corpus/build_wiring.py /tmp/build_wiring.py
          python3 /tmp/build_wiring.py .github/docs-corpus/pins.tsv /tmp/charly/candy/docs-corpus/charly.yml

      - name: Regenerate the generated content from the pinned charly
        # 30 min, from the measured runs: this step is the whole cost of the
        # job (3.3-10.8 min across the same 56 measured runs, longest
        # 10.8 min), and it is the step opencharly/docs#162 observed still
        # running while the PR's other check waited on it. It carried no
        # deadline of its own, so a stall here had nothing to fail against
        # and the run never said WHICH step was stuck. 30 min is 2.8x the
        # observed maximum, so real work does not trip it, and it fires far
        # sooner than the runner's own six-hour limit. It is under the job's
        # 60-minute total, so the step's message is what the reader sees.
        timeout-minutes: 30
        # --root points at the pinned charly checkout (the catalog walk + landing page + the
        # skill/recipe reference pages); --narrative points at the umbrella checkout, which
        # holds the four root narratives (SOUL/VISION/GRIEVANCES/LIBERATION) at their new
        # home — the generation runs the standalone plugin-docs CLI binary built in the step
        # above; --plugins at the marketplace checkout (the corpus the recipe pages project
        # from), --out at this repo's content tree. The generator's link/sidebar gates run
        # inside this step: a dead link fails the run.
        run: |
          cd /tmp/charly && /tmp/plugin-docs-bin generate \
            --root /tmp/charly \
            --narrative /tmp/umbrella \
            --plugins ${{ github.workspace }}/marketplace \
            --out ${{ github.workspace }}/src/content/docs

      - name: Drift gate — the committed content must match the pinned charly
        timeout-minutes: 10
        # Regeneration on a clean tree is a no-op by contract. A diff here means a
        # docs PR must bump the charly pin (the CI-time commit) and commit the regenerated
        # pages in the same change.
        run: bash .github/docs-corpus/check_drift.sh

      # `npm ci` rather than `npm install`: it installs strictly from the committed lockfile and
      # FAILS if package.json and the lockfile disagree. That is deliberate — a lockfile missing
      # one of rolldown's optional platform bindings once shipped here and would have broken the
      # deploy at install time, so this step is a real gate rather than a formality.
      #
      # It also supplies wrangler, which is a PINNED devDependency for that reason. Without it,
      # wrangler-action falls back to `npm i wrangler@4` inside the checkout: an unpinned install
      # outside the lockfile, in the job holding the Cloudflare token, which also mutates tracked
      # package files and so stamps every deployment `commit_dirty: true`. Arguing for `npm ci`
      # and then installing a floating dependency two steps later gives the rationale away.
      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci --no-audit --no-fund

      - name: Build
        timeout-minutes: 15
        run: npm run build

      # The site's own link-integrity gate ran in the generator step above (now available here,
      # since the pinned charly checkout carries it). What this job can still prove is that the
      # committed content builds cleanly from a clean install on a clean machine.
      - name: Verify the build produced a site
        timeout-minutes: 5
        run: |
          test -f dist/index.html
          echo "pages built: $(find dist -name '*.html' | wc -l)"

      # A fork PR gets no secrets (the trigger is `pull_request`, not `pull_request_target`, so
      # nothing leaks) — but without this guard the deploy step would FAIL on an empty token
      # rather than skip, turning every fork contribution red for a reason the contributor
      # cannot fix.
      - name: Deploy to Cloudflare Pages
        timeout-minutes: 20
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=opencharly-docs
            --branch=${{ github.head_ref || github.ref_name }}
