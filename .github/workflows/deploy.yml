# Build and deploy the site to Cloudflare Pages.
#
# THIS WORKFLOW IS THE SOLE OWNER of generation, building and publishing for the
# opencharly.ai site. The site is STANDALONE: it pins the charly repository by CI-time
# commit (no committed submodule — the charly submodule leaked the whole charly repo into
# consumer fetch trees and was removed), and this workflow
#
#   1. clones the pinned charly (recursive, with its box/* submodules) into /tmp/charly
#      at CI time and checks out the pinned commit 5716706651, plus the pinned
#      marketplace submodule (the corpus the skill pages project from),
#   2. builds the charly binary from that checkout,
#   3. regenerates the generated half of the content tree with `charly docs generate`
#      (the runtime plugin-docs generator, built on demand from the checkout),
#   4. FAILS if the committed content does not match what the pinned charly generates
#      (the drift gate: regeneration on a clean tree is a no-op, so any diff means a
#      docs PR must bump the charly CI-time commit and carry the regenerated pages),
#   5. builds the Astro site and deploys to Cloudflare Pages.
#
# WHY A WORKFLOW RATHER THAN CLOUDFLARE'S GIT INTEGRATION: connecting a Cloudflare Pages project
# to a GitHub org requires an OAuth handshake that Cloudflare must initiate — there is no API for
# it (POST .../pages/connections is 405, GET-only), just as GitHub exposes no API to create an App
# installation. Both are third-party access grants that require a human at a consent screen. This
# workflow reaches the same end state — production deploys on main, preview deploys on PRs —
# using only an API token, which IS automatable.
#
# The trade-off is explicit: the Cloudflare token lives in this repo's Actions secrets. It is
# scoped to Cloudflare Pages edit plus DNS edit on the opencharly.ai zone, and nothing else.
name: docs

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Never let two deploys of the same ref race; the later one wins.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# Only what the job uses. wrangler-action is given no gitHubToken, so it creates no GitHub
# Deployment and posts no PR comment — granting deployments/pull-requests write would be
# unused privilege.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The pinned marketplace is the corpus the recipe pages project from —
          # fetched via the submodule below. charly is NOT a submodule anymore
          # (it leaked the whole charly repo into consumer fetch trees): the
          # generator's source tree is cloned recursively at CI time (next step).
          submodules: recursive

      - name: Fetch the pinned charly source (CI-time temp checkout, recursive for box/*)
        run: |
          # Clone WITHOUT --recursive, then checkout the pinned commit, THEN init the box/*
          # submodules: --recursive at clone time pulls each box at its default-branch HEAD,
          # but the committed docs content was generated against the box commits charly@7db4f9889c
          # records — checkout-then-init pins them exactly.
          git clone https://github.com/opencharly/charly.git /tmp/charly && git -C /tmp/charly checkout 7db4f9889c && git -C /tmp/charly submodule update --init --recursive

      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm

      - uses: actions/setup-go@v5
        with:
          go-version-file: /tmp/charly/charly/go.mod
          cache-dependency-path: /tmp/charly/charly/go.sum

      - name: Build the charly binary from the pinned checkout
        run: |
          mkdir -p /tmp/charly/bin
          cd /tmp/charly/charly && go build -buildvcs=false -ldflags "-X main.BuildCalVer=docs-ci" -o /tmp/charly/bin/charly .

      - name: Regenerate the generated content from the pinned charly
        # The project root must be the charly checkout (the runtime plugin-docs binary
        # builds on demand from the project's candy source); --root points at it too,
        # --plugins at the marketplace checkout (the corpus the recipe pages project
        # from), --out at this repo's content tree. The generator's link/sidebar gates
        # run inside this step: a dead link fails the run.
        run: |
          cd /tmp/charly && /tmp/charly/bin/charly docs generate --root . --plugins ${{ github.workspace }}/marketplace --out ${{ github.workspace }}/src/content/docs

      - name: Drift gate — the committed content must match the pinned charly
        # Regeneration on a clean tree is a no-op by contract. A diff here means a
        # docs PR must bump the charly pin (the CI-time commit) and commit the regenerated
        # pages in the same change.
        run: |
          if ! git diff --exit-code -- src/content/docs; then
            echo "DRIFT: the committed site does not match the pinned charly checkout."
            echo "Bump the charly CI-time commit in deploy.yml and commit the regenerated"
            echo "content in the same docs PR (this workflow is the gate)."
            exit 1
          fi
          echo "content: committed tree matches the pinned charly (regeneration is a no-op)."

      # `npm ci` rather than `npm install`: it installs strictly from the committed lockfile and
      # FAILS if package.json and the lockfile disagree. That is deliberate — a lockfile missing
      # one of rolldown's optional platform bindings once shipped here and would have broken the
      # deploy at install time, so this step is a real gate rather than a formality.
      #
      # It also supplies wrangler, which is a PINNED devDependency for that reason. Without it,
      # wrangler-action falls back to `npm i wrangler@4` inside the checkout: an unpinned install
      # outside the lockfile, in the job holding the Cloudflare token, which also mutates tracked
      # package files and so stamps every deployment `commit_dirty: true`. Arguing for `npm ci`
      # and then installing a floating dependency two steps later gives the rationale away.
      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build
        run: npm run build

      # The site's own link-integrity gate ran in the generator step above (now available here,
      # since the pinned charly checkout carries it). What this job can still prove is that the
      # committed content builds cleanly from a clean install on a clean machine.
      - name: Verify the build produced a site
        run: |
          test -f dist/index.html
          echo "pages built: $(find dist -name '*.html' | wc -l)"

      # A fork PR gets no secrets (the trigger is `pull_request`, not `pull_request_target`, so
      # nothing leaks) — but without this guard the deploy step would FAIL on an empty token
      # rather than skip, turning every fork contribution red for a reason the contributor
      # cannot fix.
      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy dist
            --project-name=opencharly-docs
            --branch=${{ github.head_ref || github.ref_name }}
